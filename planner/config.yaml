schema:
  sensors: bool?
  gemini_api_key: password?
  ai_model: list(gemini-flash-lite-latest|gemini-flash-latest)?
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Direkter Zugriff im Heimnetz (optional, für Zum Home-Bildschirm)"
