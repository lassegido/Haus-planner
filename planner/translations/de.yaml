configuration:
  sensors:
    name: Sensoren in Home Assistant
    description: >-
      Legt vier Sensoren an (offen, in Arbeit, überfällig, heute fällig),
      etwa für Dashboards und Automationen.
network:
  8099/tcp: >-
    Direkter Zugriff im Heimnetz (ohne Anmeldung), vorbelegt mit 8099. Damit läuft der
    Planner ohne Home-Assistant-Rahmen: Safari, http://Adresse-von-Home-Assistant:8099,
    dann „Zum Home-Bildschirm“. Feld leeren schaltet es aus.
