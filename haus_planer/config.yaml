name: Haus-planner
version: "1.5.0"
slug: haus_planer
description: Aufgaben, Kanban-Board und Gantt-Zeitstrahl für zu Hause
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
map:
  - share:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:home-city
panel_title: Haus-planner
panel_admin: false
homeassistant_api: true
options:
  notify_service: ""
  reminder_time: "08:00"
  sensors: true
schema:
  notify_service: str?
  reminder_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?
  sensors: bool?
